[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "crew-health-sim-habitat"
version = "0.1.0"
description = "Simulated habitat sensors: a Bluetooth Environmental Sensing device twin, and interim SIM and REPLAY feeders for the hub's ingestReadings operation."
requires-python = ">=3.14,<3.15"
# Runtime uses the standard library only, so it installs on Windows, macOS and Linux with no wheels to build.
dependencies = []

[project.scripts]
crew-health-sim-habitat = "crew_health_sim_habitat.cli:main"

[dependency-groups]
dev = [
  "pytest>=9.2",
  "hypothesis>=6.170",
  "jsonschema>=4.26",
  "referencing>=0.37",
  "mypy>=2.4",
  "ruff>=0.17",
  "types-jsonschema>=4.26",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
xfail_strict = true
# The shared pytest temp root is cleaned by every concurrent pytest run on the machine; a race there is
# not a defect of this project.
filterwarnings = ["error", "ignore:\\(rm_rf\\) error removing:pytest.PytestWarning"]

[tool.ruff]
target-version = "py314"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "PT", "C4"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["crew_health_sim_habitat"]
known-local-folder = ["conftest"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
files = ["src", "tests"]
mypy_path = "tests"
