[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "crew-health-bench"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "crew-health",
    "httpx>=0.28.1",
    "jsonschema",
    "pydantic>=2",
    "pyrage>=1.4.0",
]

[project.scripts]
chc-bench = "crew_health_bench.api.cli:main"

[project.optional-dependencies]
official = [
    "simple-evals",
]

[tool.uv.sources]
crew-health = { path = "../../hub", editable = true }
simple-evals = { path = "vendor/simple_evals-0.0.0+652c89d0-py314-none-any.whl" }

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "hypothesis",
    "ruff",
    "mypy",
    "import-linter",
    "types-jsonschema",
    "pyrage-stubs>=1.4.0",
    "mutmut>=3.8.1; sys_platform != 'win32'",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "../scenarios/E18"]
addopts = "--strict-markers --strict-config --import-mode=importlib"
xfail_strict = true
markers = ["e18: E18 evaluation tooling", "v33: hidden rubric isolation", "v34: unsupplied findings", "trace(*ids): requirement and invariant trace"]

[tool.ruff]
target-version = "py314"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "hub/src"
cache_dir = "eval/bench/.mypy_cache"

[tool.coverage.run]
branch = true
source = ["crew_health_bench.domain", "crew_health_bench.application"]
data_file = "eval/bench/.coverage"

[tool.coverage.report]
fail_under = 95
show_missing = true

[tool.mutmut]
source_paths = ["src/"]
only_mutate = [
    "src/crew_health_bench/domain/partition.py",
    "src/crew_health_bench/domain/checks.py",
    "src/crew_health_bench/domain/sample.py",
    "src/crew_health_bench/domain/labels.py",
    "src/crew_health_bench/application/gate.py",
]
also_copy = ["config/", "schemas/", "fixtures/"]
pytest_add_cli_args = ["-c", "pyproject.toml"]
pytest_add_cli_args_test_selection = [
    "tests/test_partition.py",
    "tests/test_checks.py",
    "tests/test_sample.py",
    "tests/test_metrics.py",
    "tests/test_boundaries.py",
    "tests/test_case_documents.py",
]
use_git_change_detection = false

[tool.ruff.lint.isort]
# Fixed here so isort agrees whether ruff runs from eval/bench, from the root with --config, or hierarchically.
known-first-party = ["crew_health_bench"]
