[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "crew-health-camera"
version = "0.1.0"
description = "Camera worker (E06): webcam and station pulse and breathing estimates behind a quality gate; frames never leave the device"
requires-python = ">=3.14,<3.15"
dependencies = ["pydantic>=2", "fastapi", "uvicorn", "httpx"]

[project.optional-dependencies]
# Real capture needs OpenCV and MediaPipe's landmark models; hermetic tests never import them (marker `hardware`).
# MediaPipe brings OpenCV as opencv-contrib-python (a second OpenCV wheel would shadow the same cv2 module). It
# publishes no Intel macOS wheel for Python 3.14, so there the extra installs without it and capture fails closed
# ("the camera could not capture"), never with another model.
capture = [
  "mediapipe; sys_platform != 'darwin' or platform_machine == 'arm64'",
  "opencv-contrib-python",
  "numpy",
]

[project.scripts]
crew-health-camera = "crew_health_camera.main:main"
crew-health-camera-models = "crew_health_camera.adapters.models:main"

[dependency-groups]
dev = ["pytest", "pytest-cov", "hypothesis", "mypy", "ruff", "import-linter", "jsonschema", "types-jsonschema"]

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["crew_health_camera.tests", "crew_health_camera.tests.*"]

[tool.setuptools.package-data]
"crew_health_camera" = ["policy/*.json", "protocol.schema.json"]

[tool.pytest.ini_options]
testpaths = ["src/crew_health_camera/tests"]
addopts = "--strict-markers --strict-config --import-mode=importlib -m 'not hardware'"
# The hermetic suite deselects `hardware`; `pytest -m hardware` (extra `capture`) runs those against the camera twin.
xfail_strict = true
markers = ["trace(*ids): requirements and invariants", "hardware: optional physical hardware", "slow: bounded long running validation"]

[tool.ruff]
target-version = "py314"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["crew_health_camera"]

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "workers/camera/src"

[[tool.mypy.overrides]]
module = ["cv2", "cv2.*", "mediapipe", "mediapipe.*", "numpy", "numpy.*"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["crew_health_camera"]
# Real capture code runs in the tests marked hardware against the camera twin, a separate run from the hermetic suite.
omit = ["*/crew_health_camera/tests/*", "*/crew_health_camera/adapters/video_source.py", "*/crew_health_camera/adapters/models.py", "*/crew_health_camera/main.py"]

# Standalone member contracts (SYSTEM 6.2, PLAN gates): the worker never imports hub implementations, SQL, models
# or ground code; the domain stays pure; the acquisition path never imports the optional identity experiment.
[tool.importlinter]
root_packages = ["crew_health_camera"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "camera-layers"
type = "layers"
layers = ["crew_health_camera.main", "crew_health_camera.adapters", "crew_health_camera.application", "crew_health_camera.domain"]

[[tool.importlinter.contracts]]
name = "camera-domain-pure"
type = "forbidden"
source_modules = ["crew_health_camera.domain"]
forbidden_modules = ["fastapi", "httpx", "pydantic", "uvicorn", "sqlite3", "socket", "os", "threading", "cv2", "mediapipe", "numpy", "crew_health_camera.adapters", "crew_health_camera.evaluation"]

[[tool.importlinter.contracts]]
name = "camera-no-hub-sql-or-model"
type = "forbidden"
source_modules = ["crew_health_camera"]
forbidden_modules = ["sqlite3", "crew_health"]

[[tool.importlinter.contracts]]
name = "camera-identity-experiment-separate"
type = "forbidden"
source_modules = ["crew_health_camera.domain", "crew_health_camera.application", "crew_health_camera.adapters"]
forbidden_modules = ["crew_health_camera.evaluation"]
