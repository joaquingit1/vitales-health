# Crew Health Check hub API. Generated from the contract tables; edit CONTRACTS.md first, then this file.
openapi: "3.1.0"
jsonSchemaDialect: "https://json-schema.org/draft/2020-12/schema"
info:
  title: Crew Health Check hub API
  version: "1.0.0"
  description: "The local hub's HTTP API. CONTRACTS.md is the normative text; this file and the schemas in schemas/ are its machine readable form. Every client reads labels, thresholds, cadences, steps and words from configuration documents or from these responses; nothing is hardcoded in a client (CONTRACTS section 11). Examples in examples/ are illustrative and marked SIM or REPLAY; they are not seed data."
servers:
  - url: "http://127.0.0.1:8080"
    description: The hub on the laptop (binds to localhost by default).
  - url: "http://127.0.0.1:4010"
    description: A Prism mock of this file (see README.md).
security:
  - sessionToken: []
tags:
  - name: Hub
    description: Health, sessions, context and roster (sections 5 and 20).
  - name: Configuration
    description: Versioned configuration documents and releases (section 11).
  - name: Environment
    description: Environments, overlays, mission events and the ground link (section 12).
  - name: Demo
    description: Demo only operations. The hub serves them only in demo mode (section 12).
  - name: Sensors
    description: Sensor cards, readings, series and adapter ingest (section 13).
  - name: Warnings
    description: Warnings and their actions (section 14).
  - name: Routine
    description: Routine schedule, occurrences, items and overrides (section 15).
  - name: Check and records
    description: Daily check, journal, episodes, observations, measurement requests, reports, assessments and handoffs (sections 2 to 4 and 8).
  - name: Research
    description: The research workspace (section 4). No patient context.
  - name: Kit map
    description: What this kit can confirm (section 21).
  - name: Onboard plans
    description: Plans computed for the environment, and plan runs (section 22).
  - name: Teach and check
    description: Guided checks and CPR coaching (section 23).
  - name: Roles, skills and drills
    description: Who does what, skill freshness and drills (section 24).
  - name: Supplies
    description: Stock, uses and cover (section 25).
  - name: Medicines
    description: Medicine lots, dose proposals and administrations (section 30).
  - name: Stay or return
    description: Return readiness where a return is possible (section 27).
  - name: Help
    description: Someone needs help (section 16).
  - name: Ground
    description: The ground console and the catch-up log (sections 16, 26 and 4, Sharing).
  - name: Assistant
    description: Conversations, the model service and insights (section 17).
  - name: Participation
    description: Streak, patches and crew goal (section 8).
  - name: Views
    description: Screen projections (section 19).
  - name: Events
    description: The event stream (section 18).
paths:
  /v1/health:
    get:
      operationId: getHealth
      tags:
        - Hub
      summary: Hub liveness
      description: No authentication. Reveals no person data. No authentication.
      x-roles: []
      security: []
      parameters:
        - $ref: "#/components/parameters/CorrelationIdIn"
      responses:
        "200":
          description: OK.
          headers:
            Config-Release:
              $ref: "#/components/headers/ConfigRelease"
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: schemas/health.schema.json
              examples:
                views_health:
                  $ref: examples/views/health.json
        "400":
          description: "Bad request: MALFORMED_REQUEST."
          x-error-codes:
            - MALFORMED_REQUEST
          content:
            application/json:
              schema:
                $ref: schemas/error.schema.json
        default:
          description: "Unexpected failure: INTERNAL_ERROR."
          x-error-codes:
            - INTERNAL_ERROR
          content:
            application/json:
              schema:
                $ref: schemas/error.schema.json
  /v1/sessions:
    post:
      operationId: createSession
      tags:
        - Hub
      summary: Sign in
      description: Exchanges a local credential for a bearer token. The token is returned once. Identity and roles come only from the session. No authentication.
      x-roles: []
      security: []
      parameters:
        - $ref: "#/components/parameters/CorrelationIdIn"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "schemas/requests.schema.json#/$defs/SessionCreate"
            examples:
              session_create:
                $ref: examples/requests/session-create.json
      responses:
        "201":
          description: Created.
          headers:
            Config-Release:
              $ref: "#/components/headers/ConfigRelease"
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: schemas/session.schema.json
              examples:
                session_create_crew:
                  $ref: examples/session/create-crew.json
        "400":
          description: "Bad request: MALFORMED_REQUEST."
          x-error-codes:
            - MALFORMED_REQUEST
          content:
            application/json:
              schema:
                $ref: schemas/error.schema.json
        "415":
          description: "Unsupported media type: UNSUPPORTED_MEDIA_TYPE."
          x-error-codes:
            - UNSUPPORTED_MEDIA_TYPE
          content:
            application/json:
              schema:
                $ref: schemas/error.schema.json
        "422":
          description: "Rejected by a rule: IDENTITY_MISMATCH."
          x-error-codes:
            - IDENTITY_MISMATCH
          content:
            application/json:
              schema:
                $ref: schemas/error.schema.json
        default:
          description: "Unexpected failure: INTERNAL_ERROR."
          x-error-codes:
            - INTERNAL_ERROR
          content:
            application/json:
              schema:
                $ref: schemas/error.schema.json
