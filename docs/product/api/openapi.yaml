              $ref: "#/components/headers/ConfigRelease"
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: schemas/session.schema.json
              examples:
                session_station_screen:
                  $ref: examples/session/station-screen.json
        "400":
          description: "Bad request: MALFORMED_REQUEST."
          x-error-codes:
            - MALFORMED_REQUEST
          content:
            application/json:
              schema:
                $ref: schemas/error.schema.json
        "401":
          description: "Not signed in: UNAUTHENTICATED."
          x-error-codes:
            - UNAUTHENTICATED
          content:
            application/json:
              schema:
                $ref: schemas/error.schema.json
        "403":
          description: "Not allowed: UNAUTHORIZED_SCOPE."
          x-error-codes:
            - UNAUTHORIZED_SCOPE
          content:
            application/json:
              schema:
                $ref: schemas/error.schema.json
        default:
          description: "Unexpected failure: INTERNAL_ERROR."
          x-error-codes:
            - INTERNAL_ERROR
          content:
            application/json:
              schema:
                $ref: schemas/error.schema.json
    delete:
      operationId: deleteCurrentSession
      tags:
        - Hub
      summary: Sign out
      description: "Roles: crew, crew_medical_officer, ground, operator, station, adapter, editor."
      x-roles:
        - crew
        - crew_medical_officer
        - ground
        - operator
        - station
        - adapter
        - editor
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
