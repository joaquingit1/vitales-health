components:
  securitySchemes:
    sessionToken:
      type: http
      scheme: bearer
      description: The token from POST /v1/sessions. Identity and roles come from the session only.
    adapterToken:
      type: http
      scheme: bearer
      description: A per adapter token configured on the hub. The hub refuses an adapter_id that does not match it (ADAPTER_NOT_TRUSTED).
  parameters:
    path_name:
      in: path
      name: name
      required: true
      description: A configuration document name.
      schema:
        $ref: "schemas/common.schema.json#/$defs/config_name"
    path_release_id:
      in: path
      name: release_id
      required: true
      description: The release id.
      schema:
        $ref: "schemas/common.schema.json#/$defs/id"
    path_profile_id:
      in: path
      name: profile_id
      required: true
      description: The profile id.
      schema:
        $ref: "schemas/common.schema.json#/$defs/id"
    path_overlay_id:
      in: path
      name: overlay_id
      required: true
      description: The overlay id.
      schema:
        $ref: "schemas/common.schema.json#/$defs/id"
    path_sensor_type_id:
      in: path
      name: sensor_type_id
      required: true
      description: A sensor type id from sensor-catalog.json, for example co2.
      schema:
        $ref: "schemas/common.schema.json#/$defs/config_id"
    path_reading_id:
      in: path
      name: reading_id
      required: true
