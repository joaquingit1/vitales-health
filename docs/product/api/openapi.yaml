      name: drill_id
      required: true
      description: The drill id.
      schema:
        $ref: "schemas/common.schema.json#/$defs/id"
    path_supply_id:
      in: path
      name: supply_id
      required: true
      description: A kit-map.json supply id.
      schema:
        $ref: "schemas/common.schema.json#/$defs/config_id"
    path_ground_message_id:
      in: path
      name: ground_message_id
      required: true
      description: The ground message id.
      schema:
        $ref: "schemas/common.schema.json#/$defs/id"
    path_conversation_id:
      in: path
      name: conversation_id
      required: true
      description: The conversation id.
      schema:
        $ref: "schemas/common.schema.json#/$defs/id"
    path_insight_id:
      in: path
      name: insight_id
      required: true
      description: The insight id.
      schema:
        $ref: "schemas/common.schema.json#/$defs/id"
    path_person_id:
      in: path
      name: person_id
      required: true
      description: The person id.
      schema:
        $ref: "schemas/common.schema.json#/$defs/id"
    path_working_diagnosis_id:
      in: path
      name: working_diagnosis_id
      required: true
      description: The working diagnosis id.
      schema:
        $ref: "schemas/common.schema.json#/$defs/id"
    path_proposal_id:
      in: path
      name: proposal_id
      required: true
      description: The dose proposal id.
      schema:
        $ref: "schemas/common.schema.json#/$defs/id"
    path_administration_id:
      in: path
      name: administration_id
      required: true
      description: The administration id.
      schema:
        $ref: "schemas/common.schema.json#/$defs/id"
    path_lot_id:
      in: path
      name: lot_id
      required: true
      description: The medicine lot id.
      schema:
        type: string
        minLength: 1
    q_cursor:
      in: query
      name: cursor
      required: false
      description: Opaque cursor from page.next_cursor.
      schema:
        type: string
    q_limit:
      in: query
      name: limit
      required: false
      description: Page size. Default 50, at most 200.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    q_aggregation:
      in: query
      name: aggregation
      required: false
      description: "An aggregation id of the sensor type in sensor-catalog.json. Default: the display aggregation."
      schema:
        type: string
    q_from:
      in: query
      name: from
      required: false
      description: Start of the range, compared with observed_at. Replay series keep their original dates.
      schema:
        type: string
        format: date-time
    q_to:
      in: query
      name: to
      required: false
      description: End of the range, inclusive.
      schema:
        type: string
        format: date-time
    q_bucket_seconds:
      in: query
      name: bucket_seconds
      required: false
      description: "Point spacing. Default: the aggregation window, or every reading for latest."
      schema:
        type: integer
        minimum: 1
    q_warning_state:
      in: query
      name: state
      required: false
      description: active (raised or acknowledged, the default) or all.
      schema:
        type: string
        enum:
          - active
          - all
        default: active
    q_range:
      in: query
      name: range
      required: false
      description: today (default) or week.
      schema:
        type: string
        enum:
          - today
          - week
        default: today
    q_occurrence_state:
      in: query
      name: state
      required: false
      description: Filter by occurrence state.
      schema:
        type: string
        enum:
          - not_due
          - due
          - later
          - done
          - skipped
          - missed
    q_help_state:
      in: query
      name: state
      required: false
      description: open (default) or closed.
      schema:
        type: string
        enum:
          - open
          - closed
        default: open
    q_environment_id:
      in: query
      name: environment_id
      required: false
      description: "Default: the active environment."
      schema:
        $ref: "schemas/common.schema.json#/$defs/environment_id"
    q_after:
      in: query
      name: after
      required: false
      description: Return events with seq greater than this. Same as Last-Event-ID.
      schema:
        type: string
    q_subject:
      in: query
      name: subject
      required: false
      description: "A person_id. Default: the session person. Only crew_medical_officer and station may name someone else."
      schema:
        $ref: "schemas/common.schema.json#/$defs/id"
    q_since:
      in: query
      name: since
      required: false
      description: "Items delivered at or after this instant. Default: the start of the last gap."
      schema:
        type: string
        format: date-time
    q_types:
      in: query
      name: types
      required: false
      description: Comma separated event types to include.
      schema:
        type: string
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      description: "Unique per command. The same key with the same body returns the first result; with a different body returns 409 DUPLICATE_COMMAND. Kept 24 hours."
      schema:
        type: string
        minLength: 8
        maxLength: 128
    IfMatch:
      in: header
      name: If-Match
      required: true
      description: "The object's revision as an ETag, for example \"3\". Missing: 428 VERSION_REQUIRED. Older than current: 409 STALE_VERSION with current_state."
      schema:
        type: string
    IfNoneMatch:
      in: header
      name: If-None-Match
      required: false
      description: "A document version the client holds. Equal to the current one: 304 with no body."
      schema:
        type: string
    ConfigReleaseIn:
      in: header
      name: Config-Release
      required: false
      description: "The release the client rendered from. On a mutating request that depends on configuration, a different active release returns 409 CONFIG_VERSION_MISMATCH. Help session actions ignore it: a session keeps the release it was opened under."
      schema:
        type: string
    CorrelationIdIn:
      in: header
      name: X-Correlation-Id
      required: false
      description: Echoed in the response and in any error envelope. Generated by the hub when absent.
      schema:
        type: string
    LastEventId:
      in: header
      name: Last-Event-ID
      required: false
      description: Resume the stream after this seq.
      schema:
        type: string
  headers:
    ETag:
      description: "The object's revision, or a configuration document's version."
      schema:
        type: string
    ConfigRelease:
      description: The active configuration release id.
      schema:
        type: string
    CorrelationId:
      description: The correlation id of this request.
      schema:
        type: string
    Location:
      description: Path of the created object.
      schema:
        type: string
