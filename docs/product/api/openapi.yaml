        sensor-catalog:
          $ref: schemas/config-sensor-catalog.schema.json
        sensor-limits:
          $ref: schemas/config-sensor-limits.schema.json
        warning-rules:
          $ref: schemas/config-warning-rules.schema.json
        routine-rules:
          $ref: schemas/config-routine-rules.schema.json
        environment-profiles:
          $ref: schemas/config-environment-profiles.schema.json
        questionnaires:
          $ref: schemas/config-questionnaires.schema.json
        indicator-catalog:
          $ref: schemas/config-indicator-catalog.schema.json
        help-presentation:
          $ref: schemas/config-help-presentation.schema.json
        assistant-policy:
          $ref: schemas/config-assistant-policy.schema.json
        ui-copy:
          $ref: schemas/config-ui-copy.schema.json
        participation-rules:
          $ref: schemas/config-participation-rules.schema.json
        kit-map:
          $ref: schemas/config-kit-map.schema.json
        onboard-plans:
          $ref: schemas/config-onboard-plans.schema.json
        skills-catalog:
          $ref: schemas/config-skills-catalog.schema.json
        role-rules:
          $ref: schemas/config-role-rules.schema.json
      parameters:
        - $ref: "#/components/parameters/path_name"
        - $ref: "#/components/parameters/IfNoneMatch"
        - $ref: "#/components/parameters/CorrelationIdIn"
      responses:
        "200":
          description: OK.
          headers:
            Config-Release:
              $ref: "#/components/headers/ConfigRelease"
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: schemas/config-document.schema.json
              examples:
                configuration_document_sensor_catalog:
                  $ref: examples/configuration/document-sensor-catalog.json
        "304":
