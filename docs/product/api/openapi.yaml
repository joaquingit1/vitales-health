        - $ref: "#/components/parameters/CorrelationIdIn"
      responses:
        "204":
          description: Done. No body.
          headers:
            Config-Release:
              $ref: "#/components/headers/ConfigRelease"
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
        "400":
          description: "Bad request: MALFORMED_REQUEST."
          x-error-codes:
            - MALFORMED_REQUEST
          content:
            application/json:
              schema:
                $ref: schemas/error.schema.json
        "401":
          description: "Not signed in: UNAUTHENTICATED."
          x-error-codes:
            - UNAUTHENTICATED
          content:
            application/json:
              schema:
                $ref: schemas/error.schema.json
        "403":
          description: "Not allowed: UNAUTHORIZED_SCOPE."
          x-error-codes:
            - UNAUTHORIZED_SCOPE
          content:
            application/json:
              schema:
                $ref: schemas/error.schema.json
        "409":
          description: "Conflict: DUPLICATE_COMMAND."
          x-error-codes:
            - DUPLICATE_COMMAND
          content:
            application/json:
              schema:
                $ref: schemas/error.schema.json
        default:
          description: "Unexpected failure: INTERNAL_ERROR."
          x-error-codes:
            - INTERNAL_ERROR
          content:
            application/json:
              schema:
                $ref: schemas/error.schema.json
  /v1/context:
    get:
      operationId: getContext
      tags:
        - Hub
      summary: What every screen needs
      description: "Scoped projection for the session person. Never includes the journal. Roles: crew, crew_medical_officer, ground, operator, station, adapter, editor."
      x-roles:
