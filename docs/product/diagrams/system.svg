<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="650" viewBox="0 0 1160 650" role="img" aria-label="System overview: crew interface, controller and safety, local reasoning model, capture adapters, patient record, evidence library, calculations, handoff queue and research workbench run offline on the crew&#x27;s laptop; the ground console receives approved summaries over a delayed link." font-family="Outfit, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<defs>
<pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="7" cy="7" r="1" fill="rgba(28,30,28,0.065)"/></pattern>
<filter id="sh" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#1c1e1c" flood-opacity="0.05"/><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1c1e1c" flood-opacity="0.08"/></filter>
<linearGradient id="deep" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1d4c37"/><stop offset="1" stop-color="#113324"/></linearGradient>
<marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0.5,0.8 L7,4 L0.5,7.2" fill="none" stroke="#6b6f69" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="1160" height="650" fill="#f3f3ef"/><rect width="1160" height="650" fill="url(#dots)"/>
<text x="40" y="54" font-size="24" font-weight="300" fill="#1c1e1c">Crew Health Check, the local system</text>
<text x="40" y="80" font-size="13" fill="#6b6f69">Everything runs on the crew&#x27;s laptop. Only a summary the person approved leaves it.</text>
<rect x="22" y="108" width="1116" height="384" rx="30" fill="none" stroke="rgba(28,30,28,0.22)" stroke-dasharray="4 6" stroke-width="1.2"/>
<text x="1118" y="98" font-size="12" fill="#6b6f69" text-anchor="end">On the crew&#x27;s laptop, offline</text>
<rect x="40" y="130" width="300" height="84" rx="18" fill="#fcfcfa" filter="url(#sh)"/><text x="60" y="166" font-size="16" font-weight="500" fill="#1c1e1c">Crew interface</text><text x="60" y="190" font-size="13" fill="#6b6f69">check, concern, records, urgent help</text>
<rect x="430" y="130" width="300" height="84" rx="18" fill="#fcfcfa" filter="url(#sh)"/><text x="450" y="166" font-size="16" font-weight="500" fill="#1c1e1c">Controller and safety</text><text x="450" y="190" font-size="13" fill="#6b6f69">identity, consent, urgent rules, no model</text>
<rect x="820" y="130" width="300" height="84" rx="18" fill="url(#deep)" filter="url(#sh)"/><circle cx="1096" cy="154" r="9" fill="#e2f55c" opacity="0.3"/><circle cx="1096" cy="154" r="4.5" fill="#e2f55c"/><text x="840" y="166" font-size="16" font-weight="500" fill="#fff">Local reasoning model</text><text x="840" y="190" font-size="13" fill="rgba(255,255,255,0.8)">HuatuoGPT-3-9B with typed tools</text>
<rect x="40" y="260" width="300" height="84" rx="18" fill="#fcfcfa" filter="url(#sh)"/><text x="60" y="296" font-size="16" font-weight="500" fill="#1c1e1c">Capture adapters</text><text x="60" y="320" font-size="13" fill="#6b6f69">camera station, band, kit, reports</text>
<rect x="430" y="260" width="300" height="84" rx="18" fill="#fcfcfa" filter="url(#sh)"/><text x="450" y="296" font-size="16" font-weight="500" fill="#1c1e1c">Patient record</text><text x="450" y="320" font-size="13" fill="#6b6f69">observations, episodes, audit log</text>
<rect x="820" y="260" width="300" height="84" rx="18" fill="#fcfcfa" filter="url(#sh)"/><text x="840" y="296" font-size="16" font-weight="500" fill="#1c1e1c">Evidence library</text><text x="840" y="320" font-size="13" fill="#6b6f69">approved, versioned passages</text>
<rect x="40" y="390" width="300" height="84" rx="18" fill="#fcfcfa" filter="url(#sh)"/><text x="60" y="426" font-size="16" font-weight="500" fill="#1c1e1c">Calculations</text><text x="60" y="450" font-size="13" fill="#6b6f69">baselines, Chronos-2 experiment</text>
<rect x="430" y="390" width="300" height="84" rx="18" fill="#fcfcfa" filter="url(#sh)"/><text x="450" y="426" font-size="16" font-weight="500" fill="#1c1e1c">Handoff queue</text><text x="450" y="450" font-size="13" fill="#6b6f69">delay, outage, receipt</text>
<rect x="820" y="390" width="300" height="84" rx="18" fill="#fcfcfa" filter="url(#sh)"/><text x="840" y="426" font-size="16" font-weight="500" fill="#1c1e1c">Research workbench</text><text x="840" y="450" font-size="13" fill="#6b6f69">sources, review, release</text>
<rect x="430" y="530" width="300" height="84" rx="18" fill="none" stroke="rgba(28,30,28,0.35)" stroke-dasharray="5 5" stroke-width="1.2"/><text x="450" y="566" font-size="16" font-weight="500" fill="#1c1e1c">Ground console</text><text x="450" y="590" font-size="13" fill="#6b6f69">shared snapshot and reply</text>
<path d="M346 172 H422" fill="none" stroke="#6b6f69" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar)" marker-start="url(#ar)"/>
<path d="M736 172 H812" fill="none" stroke="#6b6f69" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar)" marker-start="url(#ar)"/>
<text x="775" y="162" font-size="12" fill="#6b6f69" text-anchor="middle">typed tools</text>
<path d="M580 220 V252" fill="none" stroke="#6b6f69" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar)" marker-start="url(#ar)"/>
<path d="M346 302 H422" fill="none" stroke="#6b6f69" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar)"/>
<text x="385" y="292" font-size="12" fill="#6b6f69" text-anchor="middle">validated</text>
<path d="M970 220 V252" fill="none" stroke="#6b6f69" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar)" marker-start="url(#ar)"/>
<text x="980" y="244" font-size="12" fill="#6b6f69" text-anchor="start">retrieval</text>
<path d="M970 384 V352" fill="none" stroke="#6b6f69" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar)"/>
<text x="980" y="372" font-size="12" fill="#6b6f69" text-anchor="start">review, release</text>
<path d="M500 350 V368 H190 V382" fill="none" stroke="#6b6f69" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar)"/>
<path d="M580 350 V382" fill="none" stroke="#6b6f69" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar)"/>
<text x="590" y="374" font-size="12" fill="#6b6f69" text-anchor="start">approved summary</text>
<path d="M580 480 V522" fill="none" stroke="#6b6f69" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar)"/>
<text x="590" y="508" font-size="12" fill="#6b6f69" text-anchor="start">delayed link, simulated</text>
</svg>
