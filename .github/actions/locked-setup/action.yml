name: Locked workspace setup
description: Reuse pinned installers and lock-keyed download caches, without caching mutable environments.
inputs:
  python:
    description: Install the hub Python dependencies
    default: 'true'
  javascript:
    description: Install the pnpm workspace dependencies
    default: 'false'
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      if: inputs.python == 'true'
      with:
        version: '0.12.19'
        enable-cache: 'true'
        cache-python: 'true'
        cache-dependency-glob: |
          hub/uv.lock
          hub/pyproject.toml
          .python-version
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      if: inputs.javascript == 'true'
      with:
        cache: 'true'
        cache_dependency_path: pnpm-lock.yaml
    - name: Install locked Python dependencies
      if: inputs.python == 'true'
      shell: bash
      run: uv sync --project hub --locked
    - name: Install locked JavaScript dependencies
      if: inputs.javascript == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
