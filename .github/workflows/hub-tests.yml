# hub-tests job of docs/DEPLOYMENT.md section 8: the hub's pytest suite with branch coverage on Ubuntu, macOS and
# Windows (the ISS and Orion fleets are Windows). The 95% branch threshold applies to domain and application code;
# no hub module has those layers yet, so coverage is reported and kept as evidence, not yet enforced.
# pnpm is needed because hub/tests/contracts/test_sha_guard.py runs the TypeScript generator and typecheck.
name: hub-tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hub-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hub-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.19"
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Install locked dependencies
        run: |
          uv sync --project hub --locked
          pnpm install --frozen-lockfile
      - name: pytest with branch coverage
        run: >-
          uv run --project hub --locked pytest -c hub/pyproject.toml -q hub/tests
          --cov --cov-config=hub/pyproject.toml --cov-branch --cov-report=term-missing
          --cov-report=xml:evidence/coverage.xml --junitxml=evidence/junit.xml
      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hub-tests-${{ matrix.os }}
          path: evidence/
          if-no-files-found: error
