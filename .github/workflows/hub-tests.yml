# hub-tests job of docs/DEPLOYMENT.md section 8: the hub's pytest suite and the eval scenarios with branch coverage on
# Ubuntu, macOS and Windows (the ISS and Orion fleets are Windows). The job fails below 95% branch coverage on domain
# and application code, as DEPLOYMENT 8 states: no ratchet, a module under the target is fixed by its owner's tests.
# eval/scenarios runs here until eval-scenarios.yml exists. pnpm is needed because hub/tests/contracts/test_sha_guard.py
# runs the TypeScript generator and typecheck.
name: hub-tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request replaces its older run; runs on main are kept as each commit's evidence.
concurrency:
  group: hub-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Python comes only from uv's managed builds, at the version pinned in .python-version and hub/.python-version.
  UV_PYTHON_PREFERENCE: only-managed

jobs:
  hub-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.19"
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Install locked dependencies
        run: |
          uv sync --project hub --locked
          pnpm install --frozen-lockfile
      - name: pytest with branch coverage
        run: >-
          uv run --project hub --locked pytest -c hub/pyproject.toml -q hub/tests eval/scenarios
          --cov --cov-config=hub/pyproject.toml --cov-branch --cov-report=term-missing
          --cov-report=xml:evidence/coverage.xml --junitxml=evidence/junit.xml
      - name: 95% branch coverage on domain and application code
        if: always()
        run: >-
          uv run --project hub --locked coverage report --rcfile=hub/pyproject.toml
          --include='*/crew_health/*/domain/*,*/crew_health/*/application/*' --sort=cover --fail-under=95
          | tee evidence/coverage-domain-application.txt
      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hub-tests-${{ matrix.os }}
          path: evidence/
          if-no-files-found: error
