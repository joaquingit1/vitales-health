# D31: every test runs on every supported OS before a merge. Actual branch coverage is combined per OS, never across OSes.
# A draft pull request runs the same suite on Ubuntu only (fast feedback, a fraction of the runner minutes); marking
# it ready for review runs every OS, and a draft cannot be merged, so the merge gate is unchanged.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hub-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_PYTHON_PREFERENCE: only-managed
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'

jobs:
  quality:
    uses: ./.github/workflows/lint.yml

  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/locked-setup
      - name: Collect every hub and eval test and partition once
        run: |
          mkdir -p evidence
          set -o pipefail
          uv run --project hub --locked python scripts/ci_suite.py collect | tee evidence/collect.log
      - name: Keep the exact collection
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: collection-plan
          path: evidence/
          if-no-files-found: error

  tests:
    needs: collect
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.draft && '["ubuntu-latest"]' || '["ubuntu-latest", "macos-latest", "windows-latest"]') }}
        group: [core-0, core-1, core-2, core-3, contracts, wheel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/locked-setup
        with:
          javascript: ${{ matrix.group == 'contracts' && 'true' || 'false' }}
      # The served demo hub (hub/tests/app/test_demo_hub.py) runs the camera twin and the camera worker as their own uv
      # projects. The twin streams NASA's public domain sample video and the worker measures it with MediaPipe's
      # landmark models; both files live outside git in ~/.cache/crew-health, verified by the SHA-256 in sample.py
      # and models.py. Restore them, fetch any that is missing, and sync both projects from their locks, so no test
      # downloads anything.
      - name: Restore the camera twin sample and the worker's landmark models
        if: startsWith(matrix.group, 'core-')
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/crew-health
          key: camera-assets-${{ hashFiles('simulators/camera/src/crew_health_camera_twin/sample.py', 'workers/camera/src/crew_health_camera/adapters/models.py') }}
      - name: Fetch and verify the camera assets; sync the camera twin and worker
        if: startsWith(matrix.group, 'core-')
        run: |
          uv run --project simulators/camera --locked camera-twin-fetch
          uv run --project workers/camera --locked --extra capture crew-health-camera-models
          uv sync --project eval/bench --locked
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: collection-plan
          path: collection
      - name: Verify the selected collection, run tests and retain durations
        run: |
          mkdir -p evidence/${{ matrix.group }}
          set -o pipefail
          uv run --project hub --locked python scripts/ci_suite.py run \
            --manifest collection/plan.json --group '${{ matrix.group }}' \
            --evidence evidence/${{ matrix.group }} 2>&1 | tee evidence/${{ matrix.group }}/pytest.log
      - name: Keep evidence even if a test fails or the job is cancelled
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hub-${{ matrix.os }}-${{ matrix.group }}
          path: evidence/
          if-no-files-found: error

  branch-coverage:
    needs: [collect, tests]
    if: ${{ always() && needs.collect.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.draft && '["ubuntu-latest"]' || '["ubuntu-latest", "macos-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/locked-setup
      - name: Fetch the trusted event base for the coverage policy
        id: base
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || github.event.repository.default_branch }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          echo "sha=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: collection-plan
          path: collection
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: hub-${{ matrix.os }}-*
          path: artifacts
      - name: Combine all six shards and enforce actual per-file branch coverage
        run: |
          mkdir -p evidence
          set -o pipefail
          uv run --project hub --locked python scripts/ci_suite.py coverage \
            --manifest collection/plan.json --base-ref '${{ steps.base.outputs.sha }}' \
            2>&1 | tee evidence/branch-coverage.log
      - name: Keep the actual branch report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: branches-${{ matrix.os }}
          path: evidence/
          if-no-files-found: error

  complete:
    needs: [collect, tests, branch-coverage, quality]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every supported OS, coverage report and quality gate
        env:
          COLLECT: ${{ needs.collect.result }}
          TESTS: ${{ needs.tests.result }}
          COVERAGE: ${{ needs.branch-coverage.result }}
          QUALITY: ${{ needs.quality.result }}
        run: |
          test "$COLLECT" = success
          test "$TESTS" = success
          test "$COVERAGE" = success
          test "$QUALITY" = success
