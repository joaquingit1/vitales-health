<text x="69" y="642" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">The AI can explain or draft. It cannot raise warnings, lower warnings, or invent a measurement.</text>
<text x="69" y="670" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#CAD9F3">LIVE, REPLAY, and SIM are labeled. Missing or unreliable readings remain not measured.</text>
