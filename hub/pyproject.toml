[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "crew-health"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = ["pydantic>=2", "fastapi", "uvicorn", "jsonschema", "referencing", "ucumvert>=0.3.3", "pint>=0.26", "pyyaml", "argon2-cffi>=25.1.0"]

[project.scripts]
crew-health = "crew_health.app.cli:main"

[dependency-groups]
dev = ["datamodel-code-generator", "pytest", "pytest-cov", "hypothesis", "mypy", "ruff", "import-linter", "httpx", "schemathesis", "types-jsonschema", "pyyaml", "types-pyyaml"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config --import-mode=importlib"
xfail_strict = true
markers = ["E01: platform foundation", "trace(*ids): requirements and invariants", "hardware: optional physical hardware", "slow: bounded long running validation"]

[tool.ruff]
target-version = "py314"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# ruff format keeps code within line-length; long strings and comments are not hand wrapped.
ignore = ["E501"]

[tool.ruff.lint.isort]
# Fixed here so isort agrees whether ruff runs from hub/ or from the root with --config.
known-first-party = ["crew_health", "tests"]

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "hub/src"

[[tool.mypy.overrides]]
# ucumvert ships no py.typed; platform/adapters/units.py narrows it to a typed Protocol at the import (SYSTEM 5.4).
module = ["ucumvert", "ucumvert.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The potency engine (AGENTS 10) runs only in the child interpreter of medicines/adapters/potency_child.py and is not
# installed in the hub venv. Run from the repository root mypy would find pharmacy/ and check the engine team's
# code under hub's settings; it is never followed, from any working directory.
module = ["pharmacy", "pharmacy.*"]
follow_imports = "skip"
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["crew_health"]

[tool.crew-health]
import-contracts = "crew_health.app.import_contracts"

[tool.setuptools.package-data]
"crew_health" = [
    "*/adapters/migrations/*.sql",
    "*/replica.schema.json",
    "*/schemas/*.json",
    "medicines/adapters/engine_schema/*.json",
]
"crew_health.contracts_gen" = ["manifest.json"]
"crew_health.identity" = ["schemas/*.json", "adapters/migrations/*.sql"]
"crew_health.consent" = ["adapters/migrations/*.sql"]

[tool.uv.sources]
pharmacy = { path = "..", editable = true }
